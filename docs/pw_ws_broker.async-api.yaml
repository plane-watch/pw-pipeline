asyncapi: 2.4.0
info:
  title: PlaneWatch Websocket Protocol
  version: 0.1.0
  description: Get a stream of aircraft from plane.watch
servers:
  plane.watch:
    description: The production plane.watch websocket broker
    url: plane.watch
    protocol: wss
    bindings:
      ws:
        method: GET
channels:
  sub-list:
    publish:
      description: Requests the list of currently subscribed tiles
      message:
        $ref: '#/components/messages/CmdSubList'
    subscribe:
      description: The list of currently subscribed tiles
      message:
        $ref: '#/components/messages/TileListResponse'
  sub:
    publish:
      description: Subscribes our client to the requested tile feed
      message:
        $ref: '#/components/messages/CmdSubTile'
  unsub:
    publish:
      description: asks the ws broker to stop sending us updated for this tile
      message:
        $ref: '#/components/messages/CmdUnSubTile'
  plane-location-history:
    publish:
      description: request the flight path history for the given plane
      message:
        $ref: "#/components/messages/CmdPlaneLocationHistory"
    subscribe:
      description: The aircraft location history
      message:
        $ref: "#/components/messages/PlaneLocationHistoryResponse"

  set-sub-tile-list:
    publish:
      description: Atomically replaces the full subscribed tile list. All tiles are validated before applying; if any tile is unknown, the entire request is rejected and existing subscriptions are preserved.
      message:
        $ref: '#/components/messages/CmdSetSubTileList'
    subscribe:
      description: |
        Lifecycle responses:
        1. ack-sub with applied tiles
        2. plane-location-list with immediate snapshot (omitted if zero aircraft)
        3. initial-sync-complete (always sent, even for zero aircraft)
      message:
        oneOf:
          - $ref: '#/components/messages/TileListResponse'
          - $ref: '#/components/messages/PlaneLocationList'
          - $ref: '#/components/messages/InitialSyncComplete'

  location-update:
    description: Plane information that comes from a subscription
    subscribe:
      description: a single plane location update
      message:
        $ref: '#/components/messages/PlaneLocation'
  location-update-list:
    description: Plane information that comes from a subscription (tick-batched)
    subscribe:
      description: a list of plane location updates
      message:
        $ref: '#/components/messages/PlaneLocationList'
components:
  messages:
    CmdSubList:
      contentType: application/json
      payload:
        required:
          - type
        type: object
        properties:
          type:
            type: string
            description: sub-list
      examples:
        - name: List of subscribed Tiles
          payload:
            type: sub-list
    CmdSetSubTileList:
      contentType: application/json
      description: Atomically replaces the full subscribed tile list
      payload:
        type: object
        required:
          - type
          - gridTile
        properties:
          type:
            type: string
            description: set-sub-tile-list
          gridTile:
            type: string
            description: comma-separated list of suffixed tile names (e.g. "tile35_high,tile36_high")
          requestId:
            type: string
            description: optional correlation ID, echoed on all lifecycle responses
      examples:
        - name: Set tile subscriptions
          payload:
            type: set-sub-tile-list
            gridTile: "tile35_high,tile36_high"
            requestId: "req-1"
    InitialSyncComplete:
      contentType: application/json
      description: Sent after the snapshot phase of set-sub-tile-list completes. Always sent, even when zero aircraft match.
      payload:
        type: object
        required:
          - type
          - tiles
          - aircraftCount
        properties:
          type:
            type: string
            description: initial-sync-complete
          tiles:
            type: array
            description: the applied tile list
            items:
              type: string
          aircraftCount:
            type: integer
            description: number of aircraft in the snapshot (can be 0)
          requestId:
            type: string
            description: echoed from the originating request, if provided
      examples:
        - name: Sync complete with aircraft
          payload:
            type: initial-sync-complete
            tiles:
              - tile35_high
              - tile36_high
            aircraftCount: 42
            requestId: "req-1"
        - name: Sync complete with zero aircraft
          payload:
            type: initial-sync-complete
            tiles:
              - tile99_high
            aircraftCount: 0
            requestId: "req-2"
    CmdSubTile:
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            description: sub
          gridTile:
            type: string
            description: the tile to subscribe to
      examples:
        - name: subscribe to tile updates
          payload:
            type: sub
            gridTile: tile38_low
    CmdUnSubTile:
      contentType: application/json
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            description: unsub
          tile:
            type: string
            description: the tile to unsubscribe to
      examples:
        - name: unsubscribe from tile updates
          payload:
            type: unsub
            gridTile: tile38_low
    CmdPlaneLocationHistory:
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            description: plane-location-history
          icao:
            type: string
            description: The aircraft's ICAO that we are interested in
          callSign:
            type: string
            description: The flights callsign that we want to track
      examples:
        - name: Example
          payload:
            type: plane-location-history
            icao: 7C2E2E
            callSign: JEO
    TileListResponse:
      contentType: application/json
      description: The response type
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            description: 'sub-list, sub-ack, unsub-ack'
          tiles:
            description: the list of tile names
            type: array
            items:
              type: string
      examples:
        - name: sub-list
          payload:
            type: sub-list
            tiles:
              - tile38_low
              - tile39_low
              - tile40_low
        - name: sub-ack
          payload:
            type: sub-ack
            tiles:
              - tile38_low
        - name: unsub-ack
          payload:
            type: sub-ack
            tiles:
              - tile38_low
    PlaneLocationList:
      contentType: application/json
      description: 'a list of PlaneLocations, sent in bulk to save on postage'
      payload:
        type: object
        required:
          - type
          - locations
        properties:
          type:
            type: string
            description: denotes the payload type. in this instance 'plane-location-list'
          locations:
            type: array
            items:
              $ref: '#/components/messages/PlaneLocation'
    PlaneLocation:
      contentType: application/json
      description: A single location event
      payload:
        type: object
        properties:
          New:
            type: boolean
          Removed:
            type: boolean
          Icao:
            type: string
          Lat:
            type: number
          Lon:
            type: number
          Heading:
            type: number
          Velocity:
            type: number
          Altitude:
            type: number
          VerticalRate:
            type: number
          AltitudeUnits:
            type: string
          FlightStatus:
            type: string
          OnGround:
            type: boolean
          Airframe:
            type: string
          AirframeType:
            type: string
          HasLocation:
            type: boolean
          HasHeading:
            type: boolean
          HasVerticalRate:
            type: boolean
          HasVelocity:
            type: boolean
          SourceTag:
            type: string
          Squawk:
            type: string
          Special:
            type: string
          TileLocation:
            type: string
          TrackedSince:
            type: string
          LastMsg:
            type: string
          SignalRssi:
            type: number
          CallSign:
            type: string
      examples:
        - name: Example Payload
          payload:
            New: false
            Removed: false
            Icao: 48415F
            Lat: 48.02207817465572
            Lon: 9.765648475060095
            Heading: 151.57095116691386
            Velocity: 455.0703242357163
            Altitude: 39000
            VerticalRate: -64
            AltitudeUnits: ''
            FlightStatus: 'ALERT, special Position Identification. Airborne or Ground'
            OnGround: false
            Airframe: No ADS-B Emitter Category Information
            AirframeType: 0/0
            HasLocation: true
            HasHeading: true
            HasVerticalRate: true
            HasVelocity: true
            SourceTag: boxie
            Squawk: '6523'
            Special: Alert
            TileLocation: tile3
            TrackedSince: '2022-03-12T09:01:02.069707133Z'
            LastMsg: '2022-03-12T09:47:22.141293262Z'
            SignalRssi: 7.781512503836437
            CallSign: KLM81K

    PlaneLocationHistoryResponse:
      contentType: application/json
      description: The response type for a plane location history request
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            description: plane-location-history
          icao:
            type: string
            description: the ICAO of the requested history
          callSign:
            type: string
            description: the callsign of the requested history
          history:
            type: array
            description: A series of places a flight has been
            items:
              $ref: "#/components/messages/LocationHistory"
              minimum: 0
      examples:
        - name: JEO History Example
          payload:
            type: plane-location-history
            icao: 7C2E2E
            callSign: JEO
            history:
              - Lat: -30.753571
                Lon: 121.483854
                Heading: 3.704627
                Velocity: 140.356688
                Altitude: 5700
              - Lat: -30.753571
                Lon: 121.483854
                Heading: 3.704627
                Velocity: 140.356688
                Altitude: 5750

    LocationHistory:
      contentType: application/json
      description: A place a flight has been
      payload:
        type: object
        required:
          - Lat
          - Lon
          - Heading
          - Velocity
          - Altitude
        properties:
          Lat:
            type: number
          Lon:
            type: number
          Heading:
            type: number
          Velocity:
            type: number
          Altitude:
            type: number
