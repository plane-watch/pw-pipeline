asyncapi: 3.0.0
defaultContentType: application/json
info:
  title: PlaneWatch Websocket Broker API
  version: 1.0.0
  description: |
    WebSocket API for streaming aircraft positions from plane.watch.
    Client connects to wss://app.plane.watch/planes?compress=true with subprotocol `planes`.
    Compression query param `compress=true` is used for iOS devices that have issues with websocket compression.
    Usage pattern from JavaScript frontend:
    - Connect with WebSocket, subprotocol `planes`
    - Subscribe to tiles via `sub` request with `gridTile`
    - Server sends `plane-location` for individual updates and `plane-location-list` in batches based on tick rate
    - Request historical trail with `plane-location-history`
    - Search aircraft/airports with `search`
    - Adjust update tick rate with `adjust-tick`
    - Request subscribed tiles list with `sub-list`
    - Set subscribed tiles list with `set-sub-tile-list`
    - Unsubscribe with `unsub`
    - Request current planes in tile with `grid-planes`
    - Request send-all-subscribed-grid-planes
  contact:
    name: PlaneWatch
    url: https://plane.watch/
  license:
    name: GPL-3.0-or-later
    url: https://spdx.org/licenses/GPL-3.0-or-later.html

servers:
  production:
    protocol: wss
    host: app.plane.watch
    pathname: /planes?compress={compress}
    description: Plane.Watch Production websocket broker, you should be hitting wss://app.plane.watch/planes?compress=true
    variables:
      compress:
        description: Enable websocket compression. Set to false for iOS clients with compression issues.
        enum: [ 'true', 'false' ]
        default: 'true'
    bindings:
      ws:
        method: GET
channels:
  planes:
    description: WebSocket endpoint for plane data
    address: /planes
    bindings:
      ws:
        method: GET
        headers:
          Sec-WebSocket-Protocol: planes
    messages:
      request:
        $ref: '#/components/messages/WsRequest'
      response:
        $ref: '#/components/messages/WsResponse'
components:
  messages:
    WsRequest:
      name: WsRequest
      title: Client request
      contentType: application/json
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            enum:
              - sub
              - sub-list
              - set-sub-tile-list
              - send-all-subscribed-grid-planes
              - unsub
              - grid-planes
              - plane-location-history
              - adjust-tick
              - search
          gridTile:
            type: string
            description: Tile name, e.g. tile38_low, tile38_high, all_low, all_high
          icao:
            type: string
            description: ICAO hex code
          callSign:
            type: string
            description: Aircraft call sign
          tick:
            type: integer
            description: Tick interval in milliseconds for updates
          query:
            type: string
            description: Search query string
      examples:
        - name: Subscribe to tile
          payload:
            type: sub
            gridTile: tile38_low
        - name: Request history
          payload:
            type: plane-location-history
            icao: 7C2E2E
            callSign: JEO
        - name: Adjust tick
          payload:
            type: adjust-tick
            tick: 500
        - name: Search
          payload:
            type: search
            query: JEO
    WsResponse:
      name: WsResponse
      title: Server response
      contentType: application/json
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            enum:
              - error
              - info
              - ack-sub
              - ack-unsub
              - sub-list
              - plane-location
              - plane-location-list
              - plane-location-history
              - search-results
          message:
            type: string
          tiles:
            type: array
            items:
              type: string
          location:
            $ref: '#/components/schemas/PlaneLocation'
          locations:
            type: array
            items:
              $ref: '#/components/schemas/PlaneLocation'
          icao:
            type: string
          callSign:
            type: string
          history:
            type: array
            items:
              $ref: '#/components/schemas/LocationHistory'
          results:
            $ref: '#/components/schemas/SearchResult'
  schemas:
    PlaneLocation:
      type: object
      properties:
        Icao:
          type: string
        Lat:
          type: number
        Lon:
          type: number
        Heading:
          type: number
        Velocity:
          type: number
        Altitude:
          type: integer
        VerticalRate:
          type: integer
        New:
          type: boolean
        Removed:
          type: boolean
        OnGround:
          type: boolean
        HasAltitude:
          type: boolean
        HasLocation:
          type: boolean
        HasHeading:
          type: boolean
        HasOnGround:
          type: boolean
        HasFlightStatus:
          type: boolean
        HasVerticalRate:
          type: boolean
        HasVelocity:
          type: boolean
        AltitudeUnits:
          type: string
        FlightStatus:
          type: string
        Airframe:
          type: string
        AirframeType:
          type: string
        SourceTag:
          type: string
        Squawk:
          type: string
        Special:
          type: string
        TileLocation:
          type: string
        TrackedSince:
          type: string
          format: date-time
        LastMsg:
          type: string
          format: date-time
        SignalRssi:
          type: number
        CallSign:
          type: string
        Registration:
          type: string
        TypeCode:
          type: string
      description: Exported aircraft position
    LocationHistory:
      type: object
      properties:
        Lat:
          type: number
        Lon:
          type: number
        Heading:
          type: number
        Velocity:
          type: number
        Altitude:
          type: integer
    SearchResult:
      type: object
      properties:
        Query:
          type: string
        Aircraft:
          type: array
          items:
            $ref: '#/components/schemas/PlaneLocation'
        Airport:
          type: array
          items:
            type: object
            properties:
              Name:
                type: string
              Icao:
                type: string
              Iata:
                type: string
              Lat:
                type: number
              Lon:
                type: number
        Route:
          type: array
          items:
            type: string
