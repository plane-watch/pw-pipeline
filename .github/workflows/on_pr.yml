---
name: Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Set workflow-wide environment variables
env:
  GHCR_ORG: ${{ github.repository_owner }}
  GHCR_REGISTRY: ghcr.io

jobs:

  hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.3.0
        name: pw_atc_api
        with:
          dockerfile: docker/pw_atc_api/Dockerfile
          ignore: DL3007,DL3059
          format: tty
      - uses: hadolint/hadolint-action@v3.3.0
        name: pw_ingest
        with:
          dockerfile: docker/pw_ingest/Dockerfile
          ignore: DL3007,DL3059
          format: tty
      - uses: hadolint/hadolint-action@v3.3.0
        name: pw_router
        with:
          dockerfile: docker/pw_router/Dockerfile
          ignore: DL3007,DL3059
          format: tty
      - uses: hadolint/hadolint-action@v3.3.0
        name: pw_ws_broker
        with:
          dockerfile: docker/pw_ws_broker/Dockerfile
          ignore: DL3007,DL3059
          format: tty
      - uses: hadolint/hadolint-action@v3.3.0
        name: runway
        with:
          dockerfile: docker/runway/Dockerfile
          ignore: DL3007,DL3059,DL3018
          format: tty

  gochecks:
    name: Go Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -skip="TestRepeater" ./...
      - name: go test (with race detection)
        run: go test -v -race -skip="TestRepeater" ./...
      - name: Report unreachable code
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          deadcode ./...

  build_and_push:
    name: Build & Push (PR)
    runs-on: ubuntu-latest
    needs: [hadolint, gochecks]
    strategy:
      matrix:
        image:
          - runway
          - pw_atc_api
          - pw_ingest
          - pw_router
          - pw_ws_broker

    steps:

      # Check out our code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get short commit hash
        id: vars
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Sanitize branch name for use as Docker tag
      - name: Sanitize branch name
        id: branch
        shell: bash
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          # Replace / with - and remove any invalid characters
          SANITIZED=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          echo "name=${SANITIZED}" >> $GITHUB_OUTPUT

      # Log into ghcr (so we can push images)
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up QEMU for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up buildx for multi platform builds
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push
      - name: Build & Push - ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_ORG }}/${{ matrix.image }}:${{ steps.branch.outputs.name }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_ORG }}/${{ matrix.image }}:${{ steps.branch.outputs.name }}-${{ steps.vars.outputs.sha_short }}
